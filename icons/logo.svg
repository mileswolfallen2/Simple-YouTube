<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Simple YouTube">
  <!--
    GENERATED by icons/build-icons.mjs -- edit the shapes there, not here.

    Temporary mark. Kept deliberately simple so it survives being shrunk to
    16px, the size the toolbar actually uses: anything finer than a triangle and
    a rail turns to mud. The rail is present because it is the idea -- six icons
    standing in for a sidebar -- and at 16px it reads as a red edge, which is
    enough to keep the mark from being a generic play button.
  -->

  <!-- The player. Near-black rather than pure black so the rounded corner stays
       visible against a dark toolbar instead of dissolving into it. -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#0B0B0B"/>

  <!-- The rail: the sidebar, reduced to what it is for. -->
  <rect x="22" y="44" width="11" height="40" rx="5.5" fill="#E5484D"/>

  <!-- The video. Offset right on purpose: centred alone it would pull the mark's
       combined optical mass left of centre once the rail's weight is added. -->
  <path d="M62 40 L62 88 L102 64 Z" fill="#F2F2F2"/>
</svg>
